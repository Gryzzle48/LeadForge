services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadforge"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Self-hosted Google Maps scraper. No Google Places API key.
  # Docs: http://localhost:8080/api/docs
  gmaps:
    image: gosom/google-maps-scraper:latest
    command: ["-data-folder", "/gmapsdata", "-addr", ":8080"]
    ports:
      - "8080:8080"
    shm_size: "1gb"
    volumes:
      - gmapsdata:/gmapsdata
    healthcheck:
      # The scraper image has bash but not curl. This only checks that the port is open.
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Inside the compose network these replace the localhost values in backend/.env.
      MAPS_SCRAPER_API_URL: http://gmaps:8080
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/leadforge
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      # So GOOGLE_SERVICE_ACCOUNT_JSON=./secrets/service-account.json works in the container.
      - ./secrets:/app/secrets:ro
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      gmaps:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser calls the site, and the site container proxies /api to the backend service.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  gmapsdata:
